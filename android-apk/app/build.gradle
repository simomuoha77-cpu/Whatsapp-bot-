plugins { id 'com.android.application' }

android {
    namespace 'com.whatsappbot.app'
    compileSdk 34
    signingConfigs {
        // Fixed key so every build installs as an update over the previous one.
        debug { storeFile file('whatsapp-bot.jks'); storePassword 'android'; keyAlias 'botkey'; keyPassword 'android' }
    }
    defaultConfig {
        applicationId "com.whatsappbot.app"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // replace with a real release signing config before publishing
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    // Pins Kotlin stdlib so checkDebugDuplicateClasses does not fail on overlapping kotlin-stdlib-jdk7/jdk8.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
