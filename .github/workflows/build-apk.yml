name: Build Android APK
on: { workflow_dispatch: {} }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android-apk
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: android-apk/app/build/outputs/apk/debug/*.apk }
      # Publish into the repo so the client dashboard can offer it for download.
      - name: Commit APK for dashboard download
        run: |
          mkdir -p apk
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk apk/WhatsApp-Bot.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add apk/WhatsApp-Bot.apk
          git commit -m "Update Android APK" || echo "APK unchanged"
          git push
